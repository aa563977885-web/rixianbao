name: 每日独立线报更新

on:
  schedule:
    - cron: '0 16,20,0,4,8,12 * * *'   # UTC，对应北京 0/4/8/12/16/20 点，每 4 小时一轮
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 校验独立核价规则
        run: python -m unittest discover -s work -p 'test_*.py'

      - name: 联盟选品 + 独立核价 + 打分 + 渲染
        id: pipeline
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TBK_APPKEY: ${{ secrets.TBK_APPKEY }}
          TBK_APPSECRET: ${{ secrets.TBK_APPSECRET }}
          JD_UNION_APPKEY: ${{ secrets.JD_UNION_APPKEY }}
          JD_UNION_APPSECRET: ${{ secrets.JD_UNION_APPSECRET }}
        run: |
          python work/source_allies.py || echo "[allies] 联盟源拉取失败/未配密钥，跳过"
          python work/independent.py
          python work/scoring.py
          python work/export_tracker.py
          python work/make_html.py
          python work/notify.py || echo "[notify] 推送失败/未配置密钥，跳过"

      - name: 失败告警（推微信/iOS）
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python work/alert_failure.py --step="${{ steps.pipeline.outcome }}" || true

      - name: 组装 Pages 目录并同步根页面
        run: |
          mkdir -p site
          cp outputs/site/index.html site/index.html
          cp outputs/site/checklist.xlsx site/checklist.xlsx
          cp outputs/site/.nojekyll site/.nojekyll 2>/dev/null || touch site/.nojekyll
          mkdir -p tb && cp -r tb site/tb
          cp outputs/site/index.html index.html

      - name: 提交数据快照
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 每日线报自动更新"
          file_pattern: 'data/ config/ site/ index.html crawl_mendao.py work/ requirements.txt DIFF_STRATEGY.md'
          skip_dirty_check: false

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 GitHub Pages
        uses: actions/deploy-pages@v4
