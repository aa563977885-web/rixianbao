name: 数据推送即部署

# 本机 local_pull.py 推送 data/ 后自动重新打分渲染并部署站点。
# 跳过 github-actions[bot] 自己的数据提交，避免和每日工作流形成循环。
on:
  push:
    paths:
      - 'data/**'
      - 'config/**'
      - 'work/**'
      - 'crawl_mendao.py'
      - 'requirements.txt'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 打分 + 清单 + 渲染
        run: |
          python work/scoring.py
          python work/export_tracker.py
          python work/make_html.py

      - name: 组装 Pages 目录并同步根页面
        run: |
          mkdir -p site
          cp outputs/site/index.html site/index.html
          cp outputs/site/checklist.xlsx site/checklist.xlsx
          cp outputs/site/.nojekyll site/.nojekyll 2>/dev/null || touch site/.nojekyll
          cp outputs/site/index.html index.html

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 GitHub Pages
        uses: actions/deploy-pages@v4
